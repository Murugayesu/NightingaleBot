[project]
name = "nursing-bot"
version = "0.2.0"
description = "Enterprise Hybrid RAG Platform for TNNMC Nursing Knowledge Base"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.32",
    "python-dotenv>=1.2.2",
    "slowapi==0.1.10",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.0.55",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "alembic==1.20.1",
    "aiobotocore==3.10.0",
    "procrastinate==3.10.0",
    "litellm==1.106.5",
    "langchain-core==1.6.5",
    "langchain-text-splitters==1.1.3",
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-litellm==0.1.45",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "pip-audit>=2.8.0",
]
parsers = [
    "openpyxl==3.1.5",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
]
