# Development overrides: live source mounts and auto-reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    command: ["uvicorn", "nursing_bot.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./src:/app/src:ro
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG

  worker:
    volumes:
      - ./src:/app/src:ro
    environment:
      ENVIRONMENT: development
