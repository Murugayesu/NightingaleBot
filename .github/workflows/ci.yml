name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra parsers
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nursing_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/nursing_bot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra parsers
      - name: Unit + integration tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras -o requirements.lock.txt
          # Accepted advisories, each justified in .github/pip-audit-ignore.txt.
          IGNORES=$(grep -v '^#' .github/pip-audit-ignore.txt | grep -v '^[[:space:]]*$' | sed 's/^/--ignore-vuln /' | xargs)
          uv run pip-audit -r requirements.lock.txt --no-deps --disable-pip $IGNORES

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the application image
        run: docker build --tag nursingbot-app:ci .
      - name: Smoke-test the image
        run: |
          docker run --rm nursingbot-app:ci python -m nursing_bot.cli --help
          docker run --rm --entrypoint id nursingbot-app:ci | grep -q 'uid=10001'
