name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra parsers
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nursing_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/nursing_bot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra parsers
      - name: Unit + integration tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras -o requirements.lock.txt
          # Accepted advisories, each justified in .github/pip-audit-ignore.txt.
          IGNORES=$(grep -v '^#' .github/pip-audit-ignore.txt | grep -v '^[[:space:]]*$' | sed 's/^/--ignore-vuln /' | xargs)
          uv run pip-audit -r requirements.lock.txt --no-deps --disable-pip $IGNORES

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        # Moderate findings in dev-only tooling are tracked in STACK.md.
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nursing_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/nursing_bot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra parsers
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (real API, fake AI providers)
        working-directory: frontend
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the application image
        run: docker build --tag nursingbot-app:ci .
      - name: Smoke-test the image
        run: |
          docker run --rm nursingbot-app:ci python -m nursing_bot.cli --help
          docker run --rm --entrypoint id nursingbot-app:ci | grep -q 'uid=10001'
      - name: Build the web image (React app + Caddy)
        run: docker build --file frontend/Dockerfile --tag nursingbot-web:ci .
      - name: Smoke-test the web image
        run: |
          docker run --rm nursingbot-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint sh nursingbot-web:ci -c 'test -f /srv/index.html && ls /srv/assets | grep -q "\.js$"'
