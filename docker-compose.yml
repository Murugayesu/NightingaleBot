# NursingBot production stack (one VM).
#
#   docker compose up -d --build        start everything
#   docker compose logs -f api worker   follow the app
#
# Local development extras (hot reload, source mounts):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# All secrets come from .env (see .env.example) or Docker secrets.
# Generate them with:  docker compose run --rm --no-deps migrate python -m nursing_bot.cli gen-secrets
#
# Images are tagged with APP_VERSION (default below). Build a new release
# under a new tag and the previous images stay available for a rollback:
#   APP_VERSION=2.0.1 docker compose up -d --build     upgrade
#   APP_VERSION=2.0.0 docker compose up -d             roll back (no build)

x-app: &app
  image: nursingbot-app:${APP_VERSION:-2.0.0}
  env_file: ${APP_ENV_FILE:-.env}
  environment: &app-env
    # This file is the production stack: the API refuses to start with default
    # secrets unless ENVIRONMENT=development is set explicitly.
    ENVIRONMENT: ${ENVIRONMENT:-production}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nursing_bot}
    S3_ENDPOINT_URL: http://minio:9000
    PHOENIX_COLLECTOR_ENDPOINT: http://otel-collector:4318/v1/traces
    INGESTION_MODE: queue
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nursing_bot}
      # Same data path as earlier releases, so existing volumes keep working.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO stopped publishing community images; Chainguard's free tier only offers :latest.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-minioadmin}:${S3_SECRET_ACCESS_KEY}@minio:9000
    # The image is distroless (no shell): one `mc mb` call creates both buckets.
    command:
      - mb
      - --ignore-existing
      - local/${S3_BUCKET_NAME:-nursing-documents}
      - local/${BACKUP_BUCKET_NAME:-nursing-backups}
      - local/${DOCUMENTS_BACKUP_BUCKET_NAME:-nursing-documents-backup}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # One-shot: Alembic migrations + job-queue schema. api and worker wait for it.
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "nursing_bot.cli", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  worker:
    <<: *app
    # Parallel jobs. Use 1 with free-tier embedding providers (per-minute limits).
    command: ["procrastinate", "--app=nursing_bot.workers.tasks.app", "worker", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - phoenix
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    environment:
      # Phoenix 21 enables login by default, which rejects the collector's traces.
      # It is bound to 127.0.0.1 (reach it through an SSH tunnel), so login is off
      # by default. To turn it on, set PHOENIX_ENABLE_AUTH=true AND add
      # `PHOENIX_SECRET: ${PHOENIX_SECRET}` (32+ chars) here — Phoenix refuses to
      # start with an empty secret, so it is not passed by default — then create a
      # system API key in the Phoenix UI and set PHOENIX_API_KEY for the collector.
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-false}
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

  # Nightly pg_dump into a shared volume, 7-day local retention ...
  backup:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-nursing_bot}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "--loop"]
    volumes:
      - backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ... mirrored continuously into object storage. --remove keeps the bucket in
  # step with the local retention, so it never grows without bound.
  # By default the target is the MinIO on this same VM: that protects against a
  # broken or deleted database, NOT against losing the VM's disk. For that, set
  # BACKUP_TARGET_URL to an external S3/R2 endpoint with credentials, e.g.
  #   https://ACCESS_KEY:SECRET@<account>.r2.cloudflarestorage.com
  # (the bucket BACKUP_BUCKET_NAME must already exist there).
  backup-sync:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_target: ${BACKUP_TARGET_URL:-http://${S3_ACCESS_KEY_ID:-minioadmin}:${S3_SECRET_ACCESS_KEY}@minio:9000}
    command: ["mirror", "--watch", "--overwrite", "--remove", "--exclude", ".partial/*", "/backups", "target/${BACKUP_BUCKET_NAME:-nursing-backups}"]
    volumes:
      - backups:/backups:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Uploaded documents (the originals) are copied the same way. No --remove:
  # a document deleted by mistake can still be recovered from the copy.
  # Create the bucket DOCUMENTS_BACKUP_BUCKET_NAME on the target first when
  # BACKUP_TARGET_URL points off the VM.
  documents-sync:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-minioadmin}:${S3_SECRET_ACCESS_KEY}@minio:9000
      MC_HOST_target: ${BACKUP_TARGET_URL:-http://${S3_ACCESS_KEY_ID:-minioadmin}:${S3_SECRET_ACCESS_KEY}@minio:9000}
    command: ["mirror", "--watch", "--overwrite", "local/${S3_BUCKET_NAME:-nursing-documents}", "target/${DOCUMENTS_BACKUP_BUCKET_NAME:-nursing-documents-backup}"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The edge: serves the React app and proxies /api to the API.
  caddy:
    image: nursingbot-web:${APP_VERSION:-2.0.0}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # Load balancer / CDN ranges in front of Caddy (space-separated CIDRs).
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  phoenix_data:
  backups:
  caddy_data:
  caddy_config:
