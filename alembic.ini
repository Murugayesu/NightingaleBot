# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Intentionally left empty. env.py overrides this at runtime with
# get_settings().DATABASE_URL, so the real connection string comes from the
# environment (.env / container env) and is never committed to the repository.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
