<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NursingBot chat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./chat.css">
  <!-- Module scripts are deferred automatically and satisfy script-src 'self'. -->
  <script type="module" src="./chat.js"></script>
</head>
<body>
  <div class="chat">
    <header class="chat-header">
      <div class="chat-heading">
        <h1 id="chat-title" class="chat-title">NursingBot</h1>
        <p id="chat-subtitle" class="chat-subtitle" hidden></p>
      </div>
      <div class="chat-header-actions">
        <button type="button" id="new-chat" class="header-btn">New chat</button>
        <!-- Only shown when the page runs inside the embed iframe. -->
        <button type="button" id="close-chat" class="header-btn header-btn--icon" aria-label="Close chat" hidden>
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </header>

    <!-- role="log" + aria-live="polite": new messages are read out by screen readers
         without interrupting them. aria-busy is set while an answer streams in. -->
    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation" tabindex="-1"></main>

    <!-- Announces "writing an answer" etc. outside the log region. -->
    <p id="sr-status" class="visually-hidden" role="status"></p>

    <form id="composer" class="composer" novalidate>
      <label for="query" class="visually-hidden">Your question</label>
      <textarea id="query" class="composer-input" rows="2" placeholder="Type your question…"
                aria-describedby="char-counter composer-hint" autocomplete="off"></textarea>
      <div class="composer-bar">
        <span id="composer-hint" class="composer-hint">Enter to send, Shift+Enter for a new line</span>
        <span id="char-counter" class="char-counter">0 / 4000 characters</span>
        <button type="button" id="stop" class="btn btn--secondary" hidden>Stop</button>
        <button type="submit" id="send" class="btn btn--primary">Send</button>
      </div>
    </form>
    <p class="disclaimer">Answers are generated from council documents and may be incomplete. Always confirm important details with the council.</p>
  </div>
</body>
</html>
