# OpenTelemetry Collector: receives traces from the api and worker, batches
# them, and forwards them to Phoenix. Swapping Phoenix for another backend
# (Grafana Tempo, Honeycomb, Datadog...) only means editing `exporters` here.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006  # Phoenix accepts OTLP at /v1/traces
    headers:
      # Only checked when Phoenix login is enabled (see docker-compose.yml).
      authorization: "Bearer ${env:PHOENIX_API_KEY}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/phoenix]
